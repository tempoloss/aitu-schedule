name = "schedule"
compatibility_date = "2026-09-01"

# Keys must sit above the first [table]: anything after [assets] would be parsed
# as assets.* and silently ignored. That is how the custom domain got skipped on
# the first deploy while wrangler still reported success.
#
# Same reasoning as jot: the workers.dev hostname is derived from the account and
# publishes the email local-part, so the custom domain is the only address.
routes = [
  { pattern = "schedule.an8kk.dev", custom_domain = true }
]
workers_dev = false
preview_urls = false

# Static-only Worker: no `main`, wrangler serves ./public from the edge.
# Only public/ goes up, so wrangler.toml and tools/ stay off the internet.
[assets]
directory = "./public"
not_found_handling = "404-page"
